<!doctype html>
<html lang="es">

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101b2b" />
  <meta name="description" content="Raíces que nos unen: aprende historia de Nicaragua explorando etapas y compitiendo con amigos." />
  <title>Raíces que nos unen | Historia en juego</title>
  <link rel="stylesheet" href="styles.css" />

<body>
  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>

      </button>
      <nav class="desktop-nav" aria-label="Menú principal">
        <button class="nav-link active" data-route="home">Inicio</button>
        <button class="nav-link" data-route="academy">Unidad I</button>

      </nav>
      <div class="header-actions">

      </div>
    </div>

  <script src="app.js"></script>
  <script src="learning.js"></script>
